
<!DOCTYPE html>
<html>
<head>
    <title>Customer Details - SBI Bank</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f6fc;
        padding: 25px;
    }

    h2 {
        color: #003b7a;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 20px;
    }

    th {
        background: #003b7a;
        color: white;
    }

    th, td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
    }

    tr:hover {
        background: #eaf2fa;
    }

    a {
        display: inline-block;
        margin-top: 20px;
        background: #003b7a;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 5px;
    }
</style>
<body>

    <h2>Registered Customers</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Customer ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Address</th>
        </tr>

        {% for customer in customers %}
        <tr>
            <td>{{ customer.customer_id }}</td>
            <td>{{ customer.name }}</td>
            <td>{{ customer.mobile }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.address }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No customers found.</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="{% url 'employee_dashboard' %}">Back to Dashboard</a>

</body>
</html>
